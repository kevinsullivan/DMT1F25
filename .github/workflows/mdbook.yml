name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.4.52"
      MDBOOK_TOC_VERSION: "0.14.2"
      MDBOOK_MERMAID_VERSION: "0.15.0"
      MDBOOK_IMAGE_SIZE_VERSION: "0.2.1"
      NODE_VERSION: "18.19.1"
    steps:
      - uses: actions/checkout@v4

      # Rust & mdBook
      - name: Install Rust & mdBook
        shell: bash
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" update
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_VERSION}" mdbook

      - name: Install mermaid-cli
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install -g @mermaid-js/mermaid-cli

      - name: Install mdbook-toc & mdbook-image-size (cargo)
        shell: bash
        run: |
          set -eux
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_TOC_VERSION}" mdbook-toc
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_IMAGE_SIZE_VERSION}" mdbook-image-size
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_MERMAID_VERSION}" mdbook-mermaid

      # Preprocessors (toc, mermaid, image-size)
      - name: Install mdBook preprocessors
        shell: bash
        run: |
          set -eux
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # mdbook-toc
          wget -qO- "https://github.com/badboy/mdbook-toc/releases/download/${MDBOOK_TOC_VERSION}/mdbook-toc-${MDBOOK_TOC_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"

          # mdbook-image-size
          wget -qO- "https://github.com/nicholasphair/mdbook-image-size/releases/download/v.${MDBOOK_IMAGE_SIZE_VERSION}/mdbook-image-size-v.${MDBOOK_IMAGE_SIZE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"

      # Mermaid CLI required by mdbook-mermaid
      - name: Setup Node and install mermaid-cli
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      # Pages setup & build
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
