# Deploy mdBook with custom domain support
name: Deploy mdBook to Custom Domain

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Set your custom domain here, or leave empty for default GitHub Pages URL
  CUSTOM_DOMAIN: "kevinsullivan.github.io/dmt1" # Change this to your domain
  MDBOOK_VERSION: "0.4.52"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install mdBook
        run: |
          curl -L https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv mdbook /usr/local/bin/

      - name: Build site
        run: |
          mdbook build

          # Add custom domain configuration
          if [[ -n "$CUSTOM_DOMAIN" ]]; then
            echo "Configuring custom domain: $CUSTOM_DOMAIN"
            echo "$CUSTOM_DOMAIN" > book/CNAME
          fi

          # Add robots.txt
          cat > book/robots.txt << EOF
          User-agent: *
          Allow: /

          Sitemap: https://${CUSTOM_DOMAIN:-${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}}/sitemap.xml
          EOF

          # Generate basic sitemap
          echo "Generating sitemap..."
          cat > book/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          EOF

          find book -name "*.html" | while read file; do
            url_path=${file#book/}
            if [[ -n "$CUSTOM_DOMAIN" ]]; then
              base_url="https://$CUSTOM_DOMAIN"
            else
              base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            fi
            echo "  <url><loc>$base_url/$url_path</loc></url>" >> book/sitemap.xml
          done

          echo "</urlset>" >> book/sitemap.xml

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Deploy to gh-pages branch
          git checkout --orphan gh-pages || git checkout gh-pages
          git rm -rf . 2>/dev/null || true
          cp -r book/* .
          git add .

          if ! git diff --staged --quiet; then
            git commit -m "Deploy to GitHub Pages
            
            Domain: ${CUSTOM_DOMAIN:-Default GitHub Pages}
            Commit: ${{ github.sha }}
            Date: $(date -u)"
            git push -f origin gh-pages
            
            if [[ -n "$CUSTOM_DOMAIN" ]]; then
              echo "✅ Site deployed to: https://$CUSTOM_DOMAIN"
            else
              echo "✅ Site deployed to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            fi
          fi
