name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.4.52"
      MDBOOK_TOC_VERSION: "0.14.2"
      MDBOOK_MERMAID_VERSION: "0.15.0"
      MDBOOK_IMAGE_SIZE_VERSION: "0.2.1"
      NODE_VERSION: "20.x"

    steps:
      - uses: actions/checkout@v4

      # Cache Rust toolchain and Cargo registry
      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-v2
          restore-keys: |
            rust-toolchain-${{ runner.os }}-

      # Cache Cargo binaries (mdBook and preprocessors)
      - name: Cache Cargo binaries
        uses: actions/cache@v4
        id: cache-cargo-binaries
        with:
          path: ~/.cargo/bin
          key: cargo-binaries-${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-toc-${{ env.MDBOOK_TOC_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}-imgsize-${{ env.MDBOOK_IMAGE_SIZE_VERSION }}-v1
          restore-keys: |
            cargo-binaries-${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-

      # Install Rust & mdBook (only if not cached)
      - name: Install Rust & mdBook
        if: steps.cache-cargo-binaries.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          # Install Rust if not already installed
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi

          "$HOME/.cargo/bin/rustup" update stable
          "$HOME/.cargo/bin/rustup" default stable

          # Install mdBook and preprocessors
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_VERSION}" mdbook --locked
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_TOC_VERSION}" mdbook-toc --locked
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_IMAGE_SIZE_VERSION}" mdbook-image-size --locked
          "$HOME/.cargo/bin/cargo" install --version "${MDBOOK_MERMAID_VERSION}" mdbook-mermaid --locked

      # Add Cargo bin to PATH (needed whether cached or not)
      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Node (no cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }} # overrides any .nvmrc/.node-version

      # Install system Chromium so Puppeteer skips the big download
      - name: Install system Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Install Mermaid CLI (no Chromium download)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm i -g @mermaid-js/mermaid-cli
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Configure Puppeteer to use system Chromium
        run: |
          if command -v chromium-browser >/dev/null 2>&1; then echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium-browser)" >> $GITHUB_ENV; fi
          if command -v chromium >/dev/null 2>&1; then echo "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium)" >> $GITHUB_ENV; fi

      # Cache mdBook build dependencies
      - name: Cache mdBook build
        uses: actions/cache@v4
        with:
          path: |
            book/
            target/
          key: mdbook-build-${{ runner.os }}-${{ hashFiles('book.toml', 'src/**/*.md') }}-v1
          restore-keys: |
            mdbook-build-${{ runner.os }}-

      # Verify installations
      - name: Verify tool installations
        run: |
          echo "🔍 Verifying installations..."
          mdbook --version
          mdbook-toc --version || echo "⚠️ mdbook-toc not available"
          mdbook-mermaid --version || echo "⚠️ mdbook-mermaid not available"
          if command -v mdbook-image-size >/dev/null 2>&1; then
            mdbook-image-size --help | head -n 1
          else
            echo "⚠️ mdbook-image-size not available"
          fi
          mmdc --version || echo "⚠️ mermaid-cli not available"
          echo "✅ Tool verification complete"

      # Normalize Markdown to NFC to avoid Unicode issues on runner
      - name: Normalize Markdown files to NFC
        run: |
          python3 - << 'PY'
          import os, unicodedata
          for root, _, files in os.walk("src"):
              for f in files:
                  if f.endswith(".md"):
                      p = os.path.join(root, f)
                      with open(p, 'rb') as fh:
                          b = fh.read()
                      try:
                          s = b.decode('utf-8')
                      except UnicodeDecodeError:
                          continue
                      n = unicodedata.normalize('NFC', s)
                      if n != s:
                          with open(p, 'w', encoding='utf-8', newline='\n') as out:
                              out.write(n)
          PY

      # Pages setup & build
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: |
          echo "🔨 Building mdBook..."
          mdbook build

          # Show build statistics
          if [[ -d book ]]; then
            echo "📊 Build completed successfully!"
            echo "📄 HTML files: $(find book -name '*.html' | wc -l)"
            echo "📁 Total files: $(find book -type f | wc -l)"
            echo "💾 Book size: $(du -sh book | cut -f1)"
          else
            echo "❌ Build failed - no output directory found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional: Show deployment summary
      - name: Deployment Summary
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}"
