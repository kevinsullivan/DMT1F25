# Deploy mdBook site - Binary download with fallbacks
name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "book.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.52"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Create bin directory
        run: mkdir -p bin

      - name: Download and install mdBook
        run: |
          set -euo pipefail

          echo "🔍 Attempting to download mdBook v${MDBOOK_VERSION}..."

          # Method 1: Direct download with proper extraction
          download_mdbook() {
            local url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            echo "📥 Trying direct download from: $url"
            
            if curl -fsSL "$url" -o mdbook.tar.gz; then
              # Check if we got a real file (not an error page)
              if [[ $(stat -c%s mdbook.tar.gz) -gt 1000 ]]; then
                echo "✅ Download successful, extracting..."
                if tar -xzf mdbook.tar.gz -C bin/; then
                  echo "✅ mdBook extracted successfully"
                  return 0
                else
                  echo "❌ Failed to extract mdBook"
                  return 1
                fi
              else
                echo "❌ Downloaded file too small (probably an error page)"
                return 1
              fi
            else
              echo "❌ Download failed"
              return 1
            fi
          }

          # Method 2: Using wget as fallback
          download_mdbook_wget() {
            local url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            echo "📥 Trying wget download from: $url"
            
            if wget -q "$url" -O mdbook.tar.gz; then
              if [[ $(stat -c%s mdbook.tar.gz) -gt 1000 ]]; then
                if tar -xzf mdbook.tar.gz -C bin/; then
                  echo "✅ mdBook extracted successfully via wget"
                  return 0
                fi
              fi
            fi
            echo "❌ wget download failed"
            return 1
          }

          # Method 3: Try alternative version (0.4.51 as fallback)
          download_fallback_version() {
            local fallback_version="0.4.51"
            local url="https://github.com/rust-lang/mdBook/releases/download/v${fallback_version}/mdbook-v${fallback_version}-x86_64-unknown-linux-gnu.tar.gz"
            echo "📥 Trying fallback version v${fallback_version}: $url"
            
            if curl -fsSL "$url" -o mdbook.tar.gz && [[ $(stat -c%s mdbook.tar.gz) -gt 1000 ]]; then
              if tar -xzf mdbook.tar.gz -C bin/; then
                echo "✅ Fallback mdBook v${fallback_version} installed successfully"
                return 0
              fi
            fi
            echo "❌ Fallback version download failed"
            return 1
          }

          # Method 4: Install via package manager
          install_via_apt() {
            echo "📦 Trying installation via package manager..."
            
            # Update package list and try to install via snap
            if command -v snap >/dev/null 2>&1; then
              if sudo snap install mdbook; then
                # Create symlink in bin directory
                ln -s /snap/bin/mdbook bin/mdbook
                echo "✅ mdBook installed via snap"
                return 0
              fi
            fi
            
            echo "❌ Package manager installation failed"
            return 1
          }

          # Method 5: Compile from source (last resort)
          compile_from_source() {
            echo "🦀 Last resort: compiling from source..."
            
            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source ~/.cargo/env
            
            # Install mdBook
            if cargo install mdbook --vers "${MDBOOK_VERSION}" --locked --root ./; then
              echo "✅ mdBook compiled from source successfully"
              return 0
            fi
            
            echo "❌ Source compilation failed"
            return 1
          }

          # Try methods in order
          if download_mdbook; then
            echo "🎉 Method 1 (direct download) succeeded"
          elif download_mdbook_wget; then
            echo "🎉 Method 2 (wget) succeeded"
          elif download_fallback_version; then
            echo "🎉 Method 3 (fallback version) succeeded"
          elif install_via_apt; then
            echo "🎉 Method 4 (package manager) succeeded"
          elif compile_from_source; then
            echo "🎉 Method 5 (source compilation) succeeded"
          else
            echo "❌ All installation methods failed"
            exit 1
          fi

          # Verify installation
          if [[ -x "bin/mdbook" ]]; then
            echo "✅ mdBook binary verified in bin/mdbook"
            ./bin/mdbook --version
          else
            echo "❌ mdBook binary not found in expected location"
            echo "Available files in bin/:"
            ls -la bin/ || echo "bin/ directory empty or doesn't exist"
            exit 1
          fi

          # Clean up
          rm -f mdbook.tar.gz

      - name: Add mdbook to PATH
        run: echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH

      - name: Verify mdBook installation
        run: |
          echo "🔍 Verifying mdBook installation..."
          which mdbook || echo "mdbook not in PATH"
          mdbook --version || echo "mdbook version check failed"

          # Show PATH for debugging
          echo "Current PATH: $PATH"
          echo "Available executables in bin/:"
          ls -la bin/ || echo "bin/ directory issue"

      - name: Build with mdBook
        run: |
          echo "🔨 Building mdBook site..."

          # Show current directory and files
          echo "📁 Current directory: $(pwd)"
          echo "📋 Available files:"
          ls -la

          # Build the book
          mdbook build

          # Verify build output  
          if [[ ! -d "./book" ]]; then
            echo "❌ Build failed: book directory not found"
            exit 1
          fi

          if [[ ! -f "./book/index.html" ]]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi

          echo "✅ Build completed successfully"
          echo "📊 Generated $(find ./book -name "*.html" | wc -l) HTML files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
